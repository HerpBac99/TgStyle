version: '3'

services:
  # База данных - PostgreSQL с pgvector
  postgres:
    image: pgvector/pgvector:pg15
    container_name: telegramstyle-postgres
    restart: always
    environment:
      - POSTGRES_DB=telegramstyle
      - POSTGRES_USER=telegramstyle_user
      - POSTGRES_PASSWORD=telegramstyle_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - telegramstyle-network

  # Кэш - Redis
  redis:
    image: redis:7-alpine
    container_name: telegramstyle-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - telegramstyle-network

  nginx:
    image: nginx:alpine
    container_name: telegramstyle-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../client:/usr/share/nginx/html:ro
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../ssl/certs:/etc/ssl/certs:ro
      - ../ssl/keys:/etc/ssl/keys:ro
    networks:
      - telegramstyle-network
    depends_on:
      - app

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: telegramstyle-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8443
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DOMAIN=${DOMAIN}
      - APP_URL=${APP_URL}
    volumes:
      - ../server:/app
      - /app/node_modules
      - ../ssl:/app/ssl:ro
      - ../client:/app/public:ro
    networks:
      - telegramstyle-network

networks:
  telegramstyle-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongodb_data: 