<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TgStyle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" crossorigin src="/assets/main-COjoFeoF.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-7YacZ6-K.css">
</head>
<body>
    <div class="app-container">
        <!-- App title at the top -->
        <h1 class="app-title">TgStyle</h1>
        
        <!-- User profile in top right -->
        <div class="user-profile">
            <div id="user-photo" class="user-photo"></div>
            <span id="user-name"></span>
        </div>
        
         <!-- Контейнер с каруселью истории анализов -->
         <div class="history-carousel-container">
             <div class="history-carousel">
                 <!-- Карты будут создаваться динамически -->
             </div>
             
             <!-- Точки навигации -->
             <div class="carousel-dots">
                 <!-- Точки будут создаваться динамически -->
             </div>
         </div>
        
        <!-- Camera button at the bottom -->
        <div class="camera-button-container">
            <button id="camera-btn" class="camera-btn" data-no-tg-styles="true" aria-label="Сделать фото">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
            </button>
        </div>
    </div>

    <!-- Экран анализа фото -->
    <div id="analysis-screen" class="analysis-screen hidden">
        <!-- Верхняя половина - фото -->
        <div class="analysis-top-section">
            <div class="photo-container">
                <img id="analysis-photo" src="" alt="Анализируемое фото" class="analysis-photo">
            </div>
        </div>

        <!-- Нижняя половина - результат -->
        <div class="analysis-bottom-section">
            <!-- Индикатор загрузки -->
            <div id="analysis-loading" class="analysis-loading">
                <div class="loading-spinner"></div>
                <p class="loading-text">Анализируем вашу одежду...</p>
            </div>

            <!-- Контейнер результата -->
            <div id="analysis-result-container" class="analysis-result-container hidden">
                <!-- Заголовок -->
                <div class="result-header">
                    <h3>✨ Анализ завершен</h3>
                </div>

                <!-- Текст анализа -->
                <div id="analysis-text" class="analysis-text">
                    <!-- Сюда будет вставлен текст анализа -->
                </div>

                <!-- Кнопки действий -->
                <div class="result-actions">
                    <button id="like-btn" class="action-btn like-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                    </button>

                    <button id="share-btn" class="action-btn share-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="48" height="48" viewBox="0 0 48 48">
                            <path d="M34,15l-3.7,19.1c0,0-0.2,0.9-1.2,0.9c-0.6,0-0.9-0.3-0.9-0.3L20,28l-4-2l-5.1-1.4c0,0-0.9-0.3-0.9-1	c0-0.6,0.9-0.9,0.9-0.9l21.3-8.5c0,0,0.7-0.2,1.1-0.2c0.3,0,0.6,0.1,0.6,0.5C34,14.8,34,15,34,15z">
                            </path>
                            <path d="M23,30.5l-3.4,3.4c0,0-0.1,0.1-0.3,0.1c-0.1,0-0.1,0-0.2,0l1-6L23,30.5z"></path>
                            <path d="M29.9,18.2c-0.2-0.2-0.5-0.3-0.7-0.1L16,26c0,0,2.1,5.9,2.4,6.9c0.3,1,0.6,1,0.6,1l1-6l9.8-9.1	C30,18.7,30.1,18.4,29.9,18.2z">
                            </path>
                          </svg>
                    </button>

                    <button id="close-analysis-btn" class="action-btn close-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Экран просмотра сохраненного анализа -->
    <div id="saved-analysis-screen" class="saved-analysis-screen hidden">
        <div class="saved-analysis-content">
            <!-- Фото -->
            <div class="saved-analysis-photo-container">
                <img id="saved-analysis-photo" src="" alt="Сохраненное фото" class="saved-analysis-photo">
            </div>

            <!-- Информация об анализе -->
            <div class="saved-analysis-info">
                <!-- Контейнер для всех данных анализа -->
                <div id="saved-analysis-data" class="saved-analysis-data">
                    <!-- Сюда будет вставлен текст анализа -->
                </div>

                <!-- Дата анализа -->
                <div id="saved-analysis-date" class="saved-analysis-date">
                    <!-- Сюда будет вставлена дата -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
